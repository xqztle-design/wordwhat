<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Word What? เกมทายคำศัพท์</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Fredoka:wght@600&display=swap" rel="stylesheet">

<style>
  /* --- ส่วนตกแต่งหน้าตา (CSS) --- */
  :root {
    --primary: #FF9F1C;
    --text-dark: #2d3436;
    --text-muted: #636e72;
    --radius: 25px;
    --font-main: 'Kanit', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: var(--font-main);
    height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; color: var(--text-dark);
  }

  /* ฉากหลัง */
  .scene {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
    background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 60%, #a8e063 60%, #56ab2f 100%);
  }
  .cloud { position: absolute; opacity: 0.8; animation: floatCloud 25s linear infinite; }
  .c1 { top: 10%; left: -10%; font-size: 5rem; }
  .c2 { top: 20%; left: -20%; font-size: 3rem; animation-duration: 35s; animation-delay: 5s; opacity: 0.6; }
  
  .prop { position: absolute; bottom: 36%; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2)); }
  .tree-1 { left: -20px; font-size: 8rem; bottom: 35%; z-index: 0; }
  .tree-2 { right: -20px; font-size: 7rem; z-index: 0; }
  .char-1 { left: 15%; font-size: 5rem; animation: bounce 3s infinite ease-in-out; bottom: 37%; }
  .char-2 { right: 15%; font-size: 4.5rem; animation: bounce 4s infinite ease-in-out; animation-delay: 1s; transform: scaleX(-1); }
  .char-3 { left: 50%; margin-left: -150px; font-size: 3rem; bottom: 39%; animation: bounce 2s infinite; }

  /* กล่อง UI */
  .container { width: 100%; max-width: 550px; margin: 0 auto; position: relative; z-index: 10; }

  .card {
    background: rgba(255, 255, 255, 0.95);
    border-radius: var(--radius); padding: 30px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.15); text-align: center;
    border: 4px solid #fff; backdrop-filter: blur(5px);
    display: none; /* ซ่อนไว้ก่อน */
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .card.active { display: block; } /* แสดงเมื่อมีคลาส active */

  h1 {
    font-family: 'Fredoka', var(--font-main); font-size: 2.5rem; color: var(--primary);
    text-shadow: 2px 2px 0px #fff; margin-bottom: 8px;
  }
  .subtitle { color: var(--text-muted); font-size: 1rem; margin-bottom: 10px;}

  .btn {
    background: var(--primary); color: white; border: none;
    padding: 12px 24px; border-radius: 50px; font-size: 1.1rem;
    font-weight: 600; cursor: pointer; box-shadow: 0 5px 0 #e67e22;
    transition: transform 0.1s; font-family: var(--font-main);
    display: inline-block; min-width: 120px; margin: 5px;
  }
  .btn:active { transform: translateY(5px); box-shadow: none; }
  .btn.secondary { background: #dfe6e9; color: var(--text-muted); box-shadow: 0 5px 0 #b2bec3; }
  .btn.secondary:active { box-shadow: none; }
  .music-btn {
    position: absolute; top: 15px; right: 15px; width: 40px; height: 40px;
    border-radius: 50%; border: none; background: #f1f2f6; font-size: 1.2rem;
    cursor: pointer; z-index: 20; box-shadow: 0 3px 0 #ccc;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-top: 20px; }
  .cat-card {
    background: #fff; border: 3px solid #f1f2f6; border-radius: 20px;
    padding: 15px; cursor: pointer; transition: 0.2s;
  }
  .cat-card:hover { background: #fff3cd; border-color: var(--primary); transform: translateY(-5px); }

  .top-bar {
    display: flex; justify-content: space-between; background: #def4fc;
    padding: 10px 20px; border-radius: 50px; margin-bottom: 20px; border: 2px solid #bce6f7;
  }
  .word-display {
    font-family: 'Fredoka', sans-serif; font-size: 2.8rem; letter-spacing: 5px;
    font-weight: 800; color: var(--text-dark); margin: 20px 0;
    text-transform: uppercase; word-break: break-word;
  }
  .hint-bubble {
    background: #fff3cd; color: #856404; border: 2px solid #ffeeba;
    border-radius: 15px; padding: 10px; margin-bottom: 20px;
    font-size: 1rem; font-weight: 600;
  }
  input[type="text"] {
    width: 100%; max-width: 350px; padding: 14px; border: 3px solid #dfe6e9;
    border-radius: 20px; font-size: 1.3rem; text-align: center; outline: none;
    font-family: var(--font-main); background: #fdfdfd; margin-bottom: 10px;
  }
  input[type="text"]:focus { border-color: var(--primary); background: #fff; }

  .feedback { margin-top: 15px; padding: 10px; border-radius: 10px; font-weight: 600; display: none; }
  .feedback.correct { background: #d4edda; color: #155724; }
  .feedback.wrong { background: #f8d7da; color: #721c24; }

  @keyframes floatCloud { 0% { transform: translateX(0); } 100% { transform: translateX(120vw); } }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
  .shake { animation: shake 0.3s; }
  @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }

  @media (max-width: 480px) {
    .word-display { font-size: 2rem; letter-spacing: 2px; }
    h1 { font-size: 2rem; }
    .prop { font-size: 3rem; } .tree-1 { left: -40px; } .tree-2 { right: -40px; }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="cloud c1">☁️</div> <div class="cloud c2">☁️</div>
  <div class="prop tree-1">🌳</div> <div class="prop tree-2">🌲</div>
  <div class="prop char-1">🦒</div> <div class="prop char-2">🐘</div> <div class="prop char-3">🐇</div>
</div>

<div class="container">
  
  <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🔇</button>

  <div id="homeScreen" class="card active">
    <div style="font-size: 4rem; margin-bottom: 10px;">🦁🍔🎒</div>
    <h1>Word What?</h1>
    <p class="subtitle">เกมทายคำศัพท์ภาษาอังกฤษ</p>
    <button class="btn" onclick="playClickSound(); goToCategoryScreen()">เริ่มเล่นเกม</button>
    <p style="margin-top: 20px; font-size: 0.9rem; color: #b2bec3;">
       High Score: <span id="highScore">0</span>
    </p>
  </div>

  <div id="categoryScreen" class="card">
    <h2>เลือกหมวดคำศัพท์</h2>
    <div class="grid" id="categoryGrid"></div>
    <div style="margin-top: 20px;">
      <button class="btn secondary" onclick="playClickSound(); goToHomeScreen()">กลับ</button>
    </div>
  </div>

  <div id="gameScreen" class="card">
    <div class="top-bar">
      <span style="color: #0984e3; font-weight: bold;">SCORE: <span id="currentScore">0</span></span>
      <span style="color: #d63031; font-weight: bold;">⏰ <span id="timerDisplay">60</span></span>
    </div>
    
    <div class="subtitle">หมวด: <span id="displayCategory">...</span></div>
    
    <div id="wordBox" class="word-display">_ _ _ _ _</div>
    
    <div id="hintBubble" class="hint-bubble">💡 ...</div>
    
    <div>
      <input type="text" id="guessInput" placeholder="พิมพ์คำตอบ..." autocomplete="off">
      <button class="btn" style="width:100%" onclick="checkAnswer()">ส่งคำตอบ</button>
      <button class="btn secondary" style="width:100%" onclick="playClickSound(); gameOver()">ยอมแพ้</button>
    </div>
    
    <div id="feedback" class="feedback"></div>
  </div>

  <div id="resultScreen" class="card">
    <div style="font-size: 5rem;" id="resultEmoji">🎉</div>
    <h2>จบเกม!</h2>
    
    <p style="font-size: 1.2rem; color: #d63031; margin-bottom: 10px;" id="answerText"></p>
    
    <div style="background: #def4fc; padding: 15px; border-radius: 15px; margin: 15px 0;">
      <p>คะแนนที่ได้</p>
      <h1 style="color: #0984e3; margin: 0;" id="finalScore">0</h1>
    </div>
    <button class="btn" onclick="playClickSound(); goToCategoryScreen()">เล่นอีกครั้ง</button>
    <button class="btn secondary" onclick="playClickSound(); goToHomeScreen()">หน้าหลัก</button>
  </div>

</div>

<script>
// --- ตัวแปร (Variables) ---
var bgmSound = new Audio('bgm.mp3');
var clickSound = new Audio('click.mp3');
var correctSound = new Audio('correct.mp3'); 
var wrongSound = new Audio('wrong.mp3');     
var winSound = new Audio('win.mp3');

bgmSound.loop = true;
bgmSound.volume = 0.3;
var isMusicPlaying = false;

var currentCategory = "";     
var currentWord = "";         
var currentHint = "";         
var score = 0;                
var timeLeft = 60;            
var timerInterval = null;     
var revealedChars = [];       

// ตัวแปรใหม่: เก็บรายการคำศัพท์ที่ "ยังเหลืออยู่" ในรอบนั้นๆ
var availableWords = [];

// --- ฟังก์ชันเกี่ยวกับเสียง ---
function toggleMusic() {
    var btn = document.getElementById('musicBtn');
    if (isMusicPlaying == true) {
        bgmSound.pause();
        isMusicPlaying = false;
        btn.innerText = "🔇";
    } else {
        bgmSound.play().catch(function() {
             alert("หาไฟล์ bgm.mp3 ไม่เจอครับ หรือ Browser บล็อกเสียงไว้");
        });
        isMusicPlaying = true;
        btn.innerText = "🔊";
    }
}

function playClickSound() {
    clickSound.currentTime = 0;
    clickSound.play();
}

// --- ฟังก์ชันเปลี่ยนหน้าจอ ---
function goToHomeScreen() {
    clearInterval(timerInterval);
    document.getElementById('homeScreen').classList.remove('active');
    document.getElementById('categoryScreen').classList.remove('active');
    document.getElementById('gameScreen').classList.remove('active');
    document.getElementById('resultScreen').classList.remove('active');
    document.getElementById('homeScreen').classList.add('active');
    
    var savedScore = localStorage.getItem('ww_highscore');
    if (savedScore == null) savedScore = 0;
    document.getElementById('highScore').innerText = savedScore;
}

function goToCategoryScreen() {
    document.getElementById('homeScreen').classList.remove('active');
    document.getElementById('categoryScreen').classList.remove('active');
    document.getElementById('gameScreen').classList.remove('active');
    document.getElementById('resultScreen').classList.remove('active');
    document.getElementById('categoryScreen').classList.add('active');
    createCategoryButtons();
}

function createCategoryButtons() {
    var grid = document.getElementById('categoryGrid');
    grid.innerHTML = ""; 
    for (var key in CATEGORIES) {
        var btn = document.createElement('div');
        btn.className = 'cat-card';
        var catData = CATEGORIES[key];
        btn.innerHTML = '<div style="font-size:2.5rem">' + catData.emoji + '</div><b>' + key + '</b>';
        btn.setAttribute("onclick", "playClickSound(); startGame('" + key + "')");
        grid.appendChild(btn);
    }
}

// --- ฟังก์ชันเริ่มเกม และ การเล่น ---
function startGame(categoryName) {
    currentCategory = categoryName;
    score = 0;
    timeLeft = 60;
    
    // สำคัญ: ก๊อปปี้รายการคำศัพท์ทั้งหมดมาใส่ availableWords ตอนเริ่มเกม
    // ใช้ slice(0) เพื่อให้ได้ "สำเนา" (ไม่ใช่ตัวจริง) จะได้ตัดคำออกได้โดยไม่กระทบข้อมูลหลัก
    availableWords = CATEGORIES[categoryName].items.slice(0);

    document.getElementById('currentScore').innerText = 0;
    document.getElementById('displayCategory').innerText = categoryName;

    document.getElementById('categoryScreen').classList.remove('active');
    document.getElementById('gameScreen').classList.add('active');

    nextWord();
    startTimer();
}

function nextWord() {
    // เช็คว่าคำหมดหรือยัง? ถ้าหมดแล้ว ให้เติมใหม่ (เล่นวน)
    if (availableWords.length == 0) {
        // เติมคำศัพท์ใหม่ทั้งหมด
        availableWords = CATEGORIES[currentCategory].items.slice(0);
    }

    // สุ่มจาก availableWords (รายการที่เหลืออยู่) แทนรายการหลัก
    var randomIndex = Math.floor(Math.random() * availableWords.length);
    var selectedObj = availableWords[randomIndex];
    
    // เอาคำที่เลือกแล้ว ออกจากรายการ availableWords
    // (คำสั่ง splice ใช้ตัดข้อมูลใน Array)
    availableWords.splice(randomIndex, 1);

    currentWord = selectedObj.w;
    currentHint = selectedObj.h;

    // ระบบสุ่มเปิดตัวอักษร
    revealedChars = [];
    for (var i = 0; i < currentWord.length; i++) {
        revealedChars[i] = false;
    }
    if (currentWord.length >= 4) {
        var amountToReveal = Math.floor(Math.random() * 2) + 1;
        for (var j = 0; j < amountToReveal; j++) {
            var randomPos = Math.floor(Math.random() * currentWord.length);
            if (currentWord[randomPos] !== ' ') {
                revealedChars[randomPos] = true;
            }
        }
    }

    var input = document.getElementById('guessInput');
    input.value = "";
    input.maxLength = currentWord.length;
    input.focus();

    document.getElementById('hintBubble').innerText = '💡 คำใบ้: ' + currentHint;
    document.getElementById('feedback').style.display = 'none';

    drawWord();
}

function drawWord() {
    var playerInput = document.getElementById('guessInput').value.toUpperCase();
    var correctWordUpper = currentWord.toUpperCase();
    var htmlToShow = "";

    for (var i = 0; i < correctWordUpper.length; i++) {
        var char = correctWordUpper[i];
        if (char === ' ') {
            htmlToShow = htmlToShow + '&nbsp;';
        } else if (revealedChars[i] == true) {
            htmlToShow = htmlToShow + '<span style="color:#0984e3">' + char + '</span>';
        } else if (playerInput[i]) {
            htmlToShow = htmlToShow + playerInput[i];
        } else {
            htmlToShow = htmlToShow + '_';
        }
    }
    document.getElementById('wordBox').innerHTML = htmlToShow;
}

function checkAnswer() {
    var input = document.getElementById('guessInput');
    var val = input.value.trim();
    var feedbackBox = document.getElementById('feedback');

    if (val == "") return;

    var cleanVal = val.toLowerCase().replace(/\s/g,'');
    var cleanTarget = currentWord.toLowerCase().replace(/\s/g,'');

    if (cleanVal === cleanTarget) {
        correctSound.play();
        score = score + 10;
        timeLeft = timeLeft + 5;
        document.getElementById('currentScore').innerText = score;
        
        feedbackBox.innerText = 'ถูกต้อง! คำตอบคือ "' + currentWord + '"';
        feedbackBox.className = 'feedback correct';
        feedbackBox.style.display = 'block';

        setTimeout(function() {
            nextWord();
        }, 1500);
    } else {
        wrongSound.play();
        input.classList.add('shake');
        feedbackBox.innerText = 'ยังไม่ถูก ลองใหม่นะ!';
        feedbackBox.className = 'feedback wrong';
        feedbackBox.style.display = 'block';

        setTimeout(function() {
            input.classList.remove('shake');
        }, 400);
        input.focus();
    }
}

function startTimer() {
    clearInterval(timerInterval);
    var timerElement = document.getElementById('timerDisplay');
    timerInterval = setInterval(function() {
        timeLeft = timeLeft - 1;
        timerElement.innerText = timeLeft;

        if (timeLeft <= 10) timerElement.style.color = 'red';
        else timerElement.style.color = '#d63031';

        if (timeLeft <= 0) gameOver();
    }, 1000);
}

function gameOver() {
    clearInterval(timerInterval);

    document.getElementById('gameScreen').classList.remove('active');
    document.getElementById('resultScreen').classList.add('active');

    // แสดงเฉลยคำศัพท์ที่ตอบไม่ได้
    var answerElement = document.getElementById('answerText');
    answerElement.innerText = "เฉลย: " + currentWord;

    var oldHigh = localStorage.getItem('ww_highscore');
    if (oldHigh == null) oldHigh = 0;
    else oldHigh = parseInt(oldHigh);

    if (score > oldHigh) localStorage.setItem('ww_highscore', score);

    document.getElementById('finalScore').innerText = score;

    if (score > 0) winSound.play();
    else wrongSound.play();
}

// --- Events ---
document.getElementById('guessInput').addEventListener('input', function() {
    drawWord();
});
document.getElementById('guessInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') checkAnswer();
});

var startScore = localStorage.getItem('ww_highscore');
if (startScore == null) startScore = 0;
document.getElementById('highScore').innerText = startScore;

// --- Data ---
var CATEGORIES = {
  "Animals": {
    emoji: "🦁",
    items: [
      { w: "Cow", h: "ร้อง มอ มอ กินหญ้า" }, { w: "Duck", h: "ร้อง ก้าบ ก้าบ" },
      { w: "Tiger", h: "ลายพาดกลอน ดุร้าย" }, { w: "Fish", h: "ว่ายอยู่ในน้ำ" },
      { w: "Bat", h: "นอนห้อยหัว ออกหากินตอนกลางคืน" }, { w: "Cat", h: "ร้อง เมี๊ยว เมี๊ยว" },
      { w: "Dog", h: "ร้อง โฮ่ง โฮ่ง ซื่อสัตย์" }, { w: "Chicken", h: "ขันตอนเช้า เอ้ก อี เอ้ก เอ้ก" },
      { w: "Spider", h: "มี 8 ขา ชักใยได้" }, { w: "Horse", h: "วิ่งเร็ว ร้อง ฮี้ๆ" },
      { w: "Buffalo", h: "มีเขาโง้ง ชอบไถนา" }, { w: "Bee", h: "ตัวเหลืองดำ ต่อยเจ็บ" },
      { w: "Rabbit", h: "หูยาว ชอบกินแครอท" }, { w: "Pig", h: "ร้อง อู๊ดๆ ตัวอ้วนกลม" },
      { w: "Sheep", h: "ขนฟูๆ สีขาว ร้อง แบะๆ" }, { w: "Flamingo", h: "นกสีชมพู ขายาว" },
      { w: "Lion", h: "เจ้าป่า มีแผงคอ" }, { w: "Giraffe", h: "คอยาว กินใบไม้บนยอดไม้" },
      { w: "Penguin", h: "นกบินไม่ได้ อยู่ที่หนาวๆ เดินเตาะแตะ" }, { w: "Panda", h: "หมีสีขาวดำ ชอบกินไผ่" },
      { w: "Bird", h: "บินได้ ร้อง จิ๊บๆ" }, { w: "Butterfly", h: "ปีกสวยงาม บินตอมดอกไม้" },
      { w: "Shark", h: "นักล่าในทะเล มีครีบหลัง" }, { w: "Dolphin", h: "ปลาแสนรู้ ขี้เล่น" },
      { w: "Whale", h: "สัตว์เลี้ยงลูกด้วยนมที่ใหญ่ที่สุดในทะเล" }, { w: "Crab", h: "มีก้าม เดินเซไปมา" },
      { w: "Octopus", h: "มีหนวดเยอะๆ พ่นหมึกได้" }, { w: "Jellyfish", h: "ตัวใสๆ ลอยในทะเล" },
      { w: "Frog", h: "ร้อง อ๊บ อ๊บ กระโดดได้" }, { w: "Snake", h: "เลื้อยไปมา ไม่มีขา" },
      { w: "Mouse", h: "ร้อง จี๊ดๆ ตัวเล็ก" }, { w: "Deer", h: "มีเขาสวยงาม อาศัยในป่า" },
      { w: "Bear", h: "ตัวใหญ่ ชอบกินน้ำผึ้ง" }, { w: "Fox", h: "เจ้าเล่ห์ หางเป็นพวง" },
      { w: "Wolf", h: "หมาป่า ร้อง บรู๊ววว" }, { w: "Zebra", h: "ม้าลาย ขาวสลับดำ" }
    ]
  },
  "Food": {
    emoji: "🍔",
    items: [
      { w: "Hamburger", h: "ขนมปังประกบเนื้อ มีผัก" }, { w: "Pizza", h: "แป้งแผ่นกลม มีหน้าเยอะๆ" },
      { w: "Cheese", h: "สีเหลือง ทำจากนม ยืดได้" }, { w: "Bread", h: "แผ่นสีขาว นุ่มๆ ทาแยมอร่อย" },
      { w: "Bacon", h: "เนื้อหมูแผ่น ทอดกรอบๆ" }, { w: "Milk", h: "สีขาว ดื่มแล้วสูง" },
      { w: "Muffin", h: "ขนมเค้กถ้วยเล็กๆ" }, { w: "Omelette", h: "ไข่เจียวม้วนๆ" },
      { w: "Pancake", h: "แผ่นแป้งทอด ราดน้ำผึ้ง" }, { w: "Toast", h: "ขนมปังปิ้งกรอบๆ" },
